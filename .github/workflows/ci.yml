name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-package:
    name: Lint, Test & Packaging Verification
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true

    - name: Set up Python 3.12
      run: uv python install 3.12

    - name: Install dependencies
      run: uv sync --all-extras --dev

    - name: Run Ruff Linter
      run: uv run ruff check .

    - name: Run Ruff Format Check
      run: uv run ruff format --check .

    - name: Run mypy Type Check
      run: uv run mypy .

    - name: Run pytest Suite
      run: uv run pytest -q

    - name: Build Wheel and Source Distribution
      run: uv build

    - name: Verify Clean Wheel Installation in Isolated Virtualenv
      run: |
        python3 -m venv /tmp/clean-wheel-venv
        /tmp/clean-wheel-venv/bin/python -m pip install --upgrade pip

        # Ensure exactly one wheel exists matching the expected distribution name
        WHEEL_COUNT=$(ls -1 dist/gemini_adk_study_coach_lab-*.whl 2>/dev/null | wc -l)
        if [ "$WHEEL_COUNT" -ne 1 ]; then
          echo "Error: Expected exactly 1 wheel matching gemini_adk_study_coach_lab-*.whl, found $WHEEL_COUNT"
          ls -la dist/
          exit 1
        fi

        /tmp/clean-wheel-venv/bin/python -m pip install dist/*.whl

        EXPECTED_VERSION=$(grep -E '^version = "[^"]+"' pyproject.toml | cut -d'"' -f2)

        (
          cd /tmp
          # Primary CLI validation
          /tmp/clean-wheel-venv/bin/gemini-adk-study-coach-lab --help
          /tmp/clean-wheel-venv/bin/gemini-adk-study-coach-lab doctor
          VERSION_OUTPUT=$(/tmp/clean-wheel-venv/bin/gemini-adk-study-coach-lab version)
          echo "$VERSION_OUTPUT"
          echo "$VERSION_OUTPUT" | grep -F "$EXPECTED_VERSION"

          # Backward-compatible alias validation
          /tmp/clean-wheel-venv/bin/gemini-adk-study-coach --help
          /tmp/clean-wheel-venv/bin/gemini-adk-study-coach version | grep -F "$EXPECTED_VERSION"

          # Verify built-in curriculum resources load
          /tmp/clean-wheel-venv/bin/python -c 'from study_coach.tools.curriculum_tools import load_curriculum; data = load_curriculum(); assert len(data.get("topics", [])) >= 4; print("Successfully loaded", len(data["topics"]), "curriculum topics from installed wheel.")'
        )

    - name: Verify Clean Sdist Installation in Isolated Virtualenv
      run: |
        python3 -m venv /tmp/clean-sdist-venv
        /tmp/clean-sdist-venv/bin/python -m pip install --upgrade pip

        # Ensure exactly one sdist exists matching the expected distribution name
        SDIST_COUNT=$(ls -1 dist/gemini_adk_study_coach_lab-*.tar.gz 2>/dev/null | wc -l)
        if [ "$SDIST_COUNT" -ne 1 ]; then
          echo "Error: Expected exactly 1 sdist matching gemini_adk_study_coach_lab-*.tar.gz, found $SDIST_COUNT"
          ls -la dist/
          exit 1
        fi

        EXPECTED_VERSION=$(grep -E '^version = "[^"]+"' pyproject.toml | cut -d'"' -f2)
        /tmp/clean-sdist-venv/bin/python -m pip install dist/*.tar.gz

        (
          cd /tmp
          # Primary CLI validation
          /tmp/clean-sdist-venv/bin/gemini-adk-study-coach-lab --help
          /tmp/clean-sdist-venv/bin/gemini-adk-study-coach-lab doctor
          VERSION_OUTPUT=$(/tmp/clean-sdist-venv/bin/gemini-adk-study-coach-lab version)
          echo "$VERSION_OUTPUT"
          echo "$VERSION_OUTPUT" | grep -F "$EXPECTED_VERSION"

          # Backward-compatible alias validation
          /tmp/clean-sdist-venv/bin/gemini-adk-study-coach version | grep -F "$EXPECTED_VERSION"

          # Verify built-in curriculum resources load
          /tmp/clean-sdist-venv/bin/python -c 'from study_coach.tools.curriculum_tools import load_curriculum; data = load_curriculum(); assert len(data.get("topics", [])) >= 4; print("Successfully loaded", len(data["topics"]), "curriculum topics from installed sdist.")'
        )
