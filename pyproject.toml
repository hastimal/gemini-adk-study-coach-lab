[project]
name = "gemini-adk-study-coach"
version = "1.1.0"
description = "AI Study Coach helping students prepare for technical certifications"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Hastimal Jangid" }
]
keywords = [
    "gemini",
    "google-adk",
    "study-coach",
    "agentic-ai",
    "streamlit",
    "certification",
    "education",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.12"
dependencies = [
    "google-adk>=0.1.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24.0",
    "opentelemetry-exporter-otlp-proto-http>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "prometheus-client>=0.20.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "streamlit>=1.65.0",
]

[project.scripts]
gemini-adk-study-coach = "study_coach.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/study_coach", "ui"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/ui",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[dependency-groups]
dev = [
    "types-protobuf>=5.0.0",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
