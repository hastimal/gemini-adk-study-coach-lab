services:
  study-coach-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: study-coach-workshop-ui
    ports:
      - "${HOST_STREAMLIT_PORT:-8501}:8501"
      - "${HOST_APP_METRICS_PORT:-8001}:8001"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - OTEL_ENABLED=true
      - OTEL_SERVICE_NAME=study-coach
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http
      - OTEL_METRICS_PORT=8001
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8501/_stcore/health" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    container_name: study-coach-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "${HOST_OTEL_GRPC_PORT:-4317}:4317"
      - "${HOST_OTEL_HTTP_PORT:-4318}:4318"
      - "${HOST_OTEL_METRICS_PORT:-8889}:8889"
    depends_on:
      - tempo
    restart: unless-stopped
    profiles:
      - observability

  tempo:
    image: grafana/tempo:2.6.1
    container_name: study-coach-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "${HOST_TEMPO_PORT:-3200}:3200"
    restart: unless-stopped
    profiles:
      - observability

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: study-coach-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${HOST_PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped
    profiles:
      - observability

  grafana:
    image: grafana/grafana:11.2.0
    container_name: study-coach-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${HOST_GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
      - tempo
    restart: unless-stopped
    profiles:
      - observability

